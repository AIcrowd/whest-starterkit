[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "whest-starterkit"
version = "0.1.0"
description = "Starter kit for the ARC Whitebox Estimation Challenge"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "flopscope>=0.11.0,<0.12.0",
    "whestbench>=0.15.0,<0.16.0",
]

# flopscope is pinned to what the GRADER charges, not to the newest release.
#
# The evaluator pins `flopscope[server]==0.11.0` and `whestbench@v0.15.0`, so 0.11.0
# is the accounting a submission is actually scored under today. flopscope 0.12.0 is
# released, but whestbench 0.15.0 declares `flopscope<0.12.0`, so the kit cannot move
# to it alone — the resolution is genuinely unsatisfiable, not merely undesirable.
#
# The three move together, in this order:
#   1. whestbench merges its pending PRs and cuts 0.16.0 (pinning flopscope 0.12.0)
#   2. the evaluator re-pins to whestbench 0.16.0 + flopscope 0.12.0 (an atomic pair)
#   3. this kit pins `flopscope>=0.12.0,<0.13.0` and `whestbench>=0.16.0,<0.17.0`
#
# Pinning the kit ahead of the grader is not the safe direction: it would report FLOP
# counts a submission is not scored on, which is the same defect as lagging, pointing
# the other way.
#
# Every FLOP figure in docs/ was measured under 0.11.0 and re-checked against both
# flopscope main @ 0812afe9 and 0.12.0 — all three agree exactly, because the ~41
# billing fixes in between do not touch the ops these examples use (matmul, tagged
# einsum, stats.norm, astype, pointwise). So step 3 is a pin bump, not a re-measure —
# but re-run tests/test_flopscope_cost_docs.py to confirm that still holds.

[dependency-groups]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
